<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="980" viewBox="0 0 1440 980" role="img" aria-labelledby="title"><title id="title">SS Lotus — bảng duyệt thiết kế icon</title><rect width="1440" height="980" fill="#F6F7F5"/><text x="64" y="64" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#53B175">SS LOTUS / APP ICON</text><text x="64" y="117" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#69428B">Hoa sen · Nét S · Sự an tĩnh</text><text x="64" y="156" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#27332E">Giữ hình sen tinh giản, khôi phục dải màu xanh lá → tím từ mẫu gốc.</text><rect x="64" y="202" width="650" height="590" rx="24" fill="white"/><image href="lotus-app-icon.svg" x="197" y="240" width="384" height="384"/><text x="100" y="684" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#53B175">01 / ĐỀ XUẤT CHÍNH</text><text x="100" y="723" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#27332E">Giữ hoa sen, dáng người và đường cong chữ S.</text><text x="100" y="754" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#27332E">Dải màu gốc làm nền icon; hoa sen trắng giữ độ rõ.</text><text x="766" y="225" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#68726D">THAM CHIẾU GỐC</text><image href="reference-original.svg" x="770" y="246" width="210" height="166"/><text x="1050" y="225" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#68726D">LOGO NỀN TRONG</text><image href="lotus-mark-primary.svg" x="1040" y="246" width="250" height="166"/><text x="766" y="468" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#68726D">BẢNG MÀU TỪ FAVICON GỐC</text><rect x="766" y="492" width="134" height="66" rx="12" fill="#53B175" stroke="#E3E9E5"/><text x="766" y="588" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#27332E">#53B175</text><text x="766" y="614" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#68726D">Xanh lá / đầu dải</text><rect x="922" y="492" width="134" height="66" rx="12" fill="#69428B" stroke="#E3E9E5"/><text x="922" y="588" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#27332E">#69428B</text><text x="922" y="614" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#68726D">Tím / cuối dải</text><rect x="1078" y="492" width="134" height="66" rx="12" fill="#5B897D" stroke="#E3E9E5"/><text x="1078" y="588" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#27332E">#5B897D</text><text x="1078" y="614" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#68726D">Xanh ngọc / giữa</text><rect x="1234" y="492" width="134" height="66" rx="12" fill="#FFFFFF" stroke="#E3E9E5"/><text x="1234" y="588" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#27332E">#FFFFFF</text><text x="1234" y="614" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#68726D">Trắng / biểu tượng</text><text x="766" y="684" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#68726D">KIỂM TRA KÍCH THƯỚC</text><image href="lotus-favicon.svg" x="766" y="714" width="16" height="16"/><text x="766" y="806" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#68726D">16 px</text><image href="lotus-app-icon.svg" x="864" y="714" width="24" height="24"/><text x="864" y="806" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#68726D">24 px</text><image href="lotus-app-icon.svg" x="962" y="714" width="32" height="32"/><text x="962" y="806" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#68726D">32 px</text><image href="lotus-app-icon.svg" x="1060" y="714" width="48" height="48"/><text x="1060" y="806" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#68726D">48 px</text><image href="lotus-app-icon.svg" x="1174" y="714" width="64" height="64"/><text x="1174" y="806" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#68726D">64 px</text><text x="64" y="875" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#69428B">SVG vector · Gradient xanh lá → tím · Giữ nguyên các điểm màu từ SVG gốc</text><text x="64" y="915" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#68726D">Màu trích từ favicon.svg bạn gửi. Đã cập nhật bộ thiết kế; chưa đổi theme của ứng dụng.</text></svg>
