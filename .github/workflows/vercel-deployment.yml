name: CI and deploy to Vercel

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  validate:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run test:scripts
      - run: npm run functions:check
      - run: npm run functions:test
      - run: npm test
      - run: npm run build

  migrate_database:
    name: Apply Supabase production migrations
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: supabase-production-migrations
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Verify migration credentials and target
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Configure SUPABASE_ACCESS_TOKEN in the production environment."; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo "Configure SUPABASE_DB_PASSWORD in the production environment."; exit 1; }
          test -n "$SUPABASE_PROJECT_REF" || { echo "Configure SUPABASE_PROJECT_REF as a production environment variable."; exit 1; }

      - name: Link the production project
        run: npx --yes supabase@2.122.0 link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Inspect migration history
        run: npx --yes supabase@2.122.0 migration list --linked

      - name: Preview pending migrations
        run: npx --yes supabase@2.122.0 db push --linked --dry-run --skip-vault

      - name: Apply pending migrations
        run: npx --yes supabase@2.122.0 db push --linked --yes --skip-vault

      - name: Verify applied migration history
        run: npx --yes supabase@2.122.0 migration list --linked

  deploy:
    name: Deploy production
    needs: [validate, migrate_database]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@65.2.0

      - name: Pull Vercel production configuration
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build deployment artifact
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Verify deployed library Function matches this release
        env:
          LIBRARY_FUNCTION_HEALTH_URL: ${{ vars.LIBRARY_FUNCTION_HEALTH_URL }}
        run: |
          test -n "$LIBRARY_FUNCTION_HEALTH_URL" || { echo "Configure LIBRARY_FUNCTION_HEALTH_URL before production rollout."; exit 1; }
          expected_release=$(node scripts/library-function-release-id.mjs)
          node scripts/verify-library-function-release.mjs --url "$LIBRARY_FUNCTION_HEALTH_URL" --expected "$expected_release"

      - name: Deploy production artifact
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          deployment_url=$(vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN")
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release for deployment run
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          tag="0.${GITHUB_RUN_NUMBER}.0"
          notes=$(cat <<EOF
          Production deployment succeeded.

          - Version: ${tag}
          - Commit: ${GITHUB_SHA}
          - Deployment: ${DEPLOYMENT_URL}
          - Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
          )
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "GitHub Release ${tag} already exists; skipping release creation."
          else
            gh release create "$tag" \
              --target "$GITHUB_SHA" \
              --title "$tag" \
              --notes "$notes"
          fi
